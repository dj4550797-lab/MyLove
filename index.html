<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>For Akshara ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Caveat:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #fff0f5;
      --bg-secondary: #fce4ec;
      --accent: #ff4d88;
      --accent-hover: #e03370;
      --accent-glow: rgba(255, 77, 136, 0.35);
      --card-bg: rgba(255, 255, 255, 0.94);
      --card-border: rgba(255, 255, 255, 0.98);
      --text-main: #3d2331;
      --text-muted: #7d596c;
      --btn-yes: #ff4d88;
      --btn-no: #8a7888;
      --radius: 28px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      position: fixed;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(12px, 4vw, 24px);
    }

    #hearts-canvas, #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      pointer-events: none;
    }
    #hearts-canvas { z-index: 1; }
    #confetti-canvas { z-index: 999; }

    .viewport-box {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 10;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1.5px solid var(--card-border);
      border-radius: var(--radius);
      padding: clamp(24px, 6vw, 36px) clamp(18px, 5vw, 28px);
      text-align: center;
      box-shadow: 0 16px 45px rgba(255, 120, 160, 0.2);
      position: relative;
      animation: cardPopIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes cardPopIn {
      from { opacity: 0; transform: translateY(16px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .sticker-container {
      width: 100%;
      min-height: clamp(110px, 22vw, 140px);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: clamp(12px, 3vw, 18px);
    }

    .sticker-svg-wrap {
      width: clamp(100px, 25vw, 130px);
      height: clamp(100px, 25vw, 130px);
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 8px 18px rgba(255, 77, 136, 0.25));
    }

    .sticker-img {
      max-width: clamp(130px, 32vw, 165px);
      max-height: clamp(110px, 28vw, 145px);
      width: auto;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 8px 18px rgba(255, 77, 136, 0.25));
    }

    .sticker-emoji {
      font-size: clamp(3.5rem, 10vw, 4.8rem);
      line-height: 1.1;
      filter: drop-shadow(0 6px 14px rgba(255, 77, 136, 0.25));
      word-break: break-word;
    }

    .anim-bounce { animation: bounce 2s infinite ease-in-out; }
    .anim-float { animation: float 2.6s infinite ease-in-out; }
    .anim-pulse { animation: pulse 1.6s infinite ease-in-out; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    .title-main {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.4rem, 4.5vw, 1.8rem);
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
      margin-bottom: 10px;
      word-wrap: break-word;
    }

    .subtitle-note {
      font-size: clamp(0.9rem, 2.8vw, 1.02rem);
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: clamp(18px, 4vw, 24px);
    }

    .pleading-badge {
      display: inline-block;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--accent);
      background: rgba(255, 77, 136, 0.12);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .letter-box {
      font-family: 'Caveat', cursive;
      font-size: clamp(1.2rem, 3.8vw, 1.4rem);
      line-height: 1.6;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.9);
      border: 1.5px dashed rgba(255, 77, 136, 0.45);
      border-radius: 18px;
      padding: clamp(14px, 4vw, 20px);
      margin: 16px 0;
      text-align: left;
      white-space: pre-line;
      max-height: clamp(180px, 35vh, 260px);
      overflow-y: auto;
      user-select: text;
    }

    .btn-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 3vw, 16px);
      min-height: 54px;
      position: relative;
    }

    .btn-romantic {
      border: none;
      outline: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      font-size: clamp(0.95rem, 2.8vw, 1.05rem);
      padding: 13px clamp(24px, 6vw, 34px);
      min-height: 48px;
      border-radius: 999px;
      transition: transform 0.15s ease, background-color 0.2s ease, box-shadow 0.2s ease;
      touch-action: manipulation;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-romantic:active { transform: scale(0.94); }

    .btn-yes {
      background: var(--btn-yes);
      color: #ffffff;
      box-shadow: 0 8px 22px var(--accent-glow);
    }

    @media (hover: hover) and (pointer: fine) {
      .btn-yes:hover {
        background: var(--accent-hover);
        transform: translateY(-2px);
      }
    }

    .btn-no {
      background: #ffffff;
      color: var(--btn-no);
      border: 1px solid rgba(0, 0, 0, 0.12);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
    }

    .btn-evasive-run {
      position: fixed !important;
      z-index: 1000;
      transition: left 0.22s cubic-bezier(0.18, 0.89, 0.32, 1.28), top 0.22s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      touch-action: none !important;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2) !important;
    }
  </style>
</head>
<body>

  <canvas id="hearts-canvas"></canvas>
  <canvas id="confetti-canvas"></canvas>
  <audio id="bg-audio" loop preload="auto"></audio>

  <main class="viewport-box">
    <section class="glass-card" id="card-box" aria-live="polite"></section>
  </main>

  <script>
    const CONFIG_KEY = 'akshara_love_config_v1';
    const LOGS_KEY = 'akshara_love_clicks_v1';

    // Auto-normalize any Giphy or Webpage URL to direct GIF
    function normalizeStickerUrl(url) {
      if (!url || typeof url !== 'string') return '';
      url = url.trim();

      const giphyMatch = url.match(/giphy\.com\/(?:stickers|gifs)\/(?:[\w-]+-)?([a-zA-Z0-9]+)/);
      if (giphyMatch && giphyMatch[1]) {
        return `https://i.giphy.com/media/${giphyMatch[1]}/giphy.gif`;
      }

      const giphyMediaMatch = url.match(/giphy\.com\/media\/([a-zA-Z0-9]+)/);
      if (giphyMediaMatch && giphyMediaMatch[1]) {
        return `https://i.giphy.com/media/${giphyMediaMatch[1]}/giphy.gif`;
      }

      return url;
    }

    // Built-in Instant SVGs
    const SVG_STICKERS = {

        <circle cx="33" cy="45" r="3" fill="#fff" />
        <circle cx="38" cy="51" r="1.5" fill="#fff" />
        <circle cx="61" cy="45" r="3" fill="#fff" />
        <circle cx="66" cy="51" r="1.5" fill="#fff" />
        <polygon points="50,58 47,61 53,61" fill="#ff4d88" />
        <path d="M 46 65 Q 50 62 54 65" stroke="#4a2c3a" stroke-width="2" fill="none" />
        <circle cx="27" cy="56" r="6" fill="#ff99bb" opacity="0.5"/>

      </svg>`,
      cryingCat: `<svg viewBox="0 0 100 100" width="100%" height="100%">
        <circle cx="50" cy="52" r="35" fill="#ffe6ee" />
        <polygon points="24,25 36,44 18,40" fill="#ffaec4" />
        <polygon points="76,25 64,44 82,40" fill="#ffaec4" />
        <ellipse cx="37" cy="49" rx="5" ry="6" fill="#3a1d2c" />
        <ellipse cx="63" cy="49" rx="5" ry="6" fill="#3a1d2c" />
        <path d="M 32 55 Q 30 75 35 78 Q 40 75 38 55 Z" fill="#64b5f6" />
        <path d="M 68 55 Q 70 75 65 78 Q 60 75 62 55 Z" fill="#64b5f6" />
        <polygon points="50,58 47,61 53,61" fill="#ff4d88" />
        <path d="M 45 66 Q 50 61 55 66" stroke="#3a1d2c" stroke-width="2" fill="none" />
      </svg>`,
      sadCat: `<svg viewBox="0 0 100 100" width="100%" height="100%">
        <circle cx="50" cy="52" r="35" fill="#fce4ec" />
        <polygon points="25,28 35,46 19,44" fill="#f8bbd0" />
        <polygon points="75,28 65,46 81,44" fill="#f8bbd0" />
        <ellipse cx="37" cy="50" rx="4" ry="4" fill="#3a1d2c" />

        <path d="M 50,75 L 47,71 Q 42,67 46,62 Q 50,67 50,70 L 53,67 Q 56,62 60,67 L 50,75 Z" fill="#ff4d88" />
      </svg>`,
      celebrateCat: `<svg viewBox="0 0 100 100" width="100%" height="100%">
        <polygon points="50,10 40,35 60,35" fill="#ffb703" />
        <circle cx="50" cy="10" r="3" fill="#fb8500" />
        <circle cx="50" cy="55" r="35" fill="#ffd1dc" />
        <polygon points="24,28 35,48 18,45" fill="#ffb6c1" />
        <polygon points="76,28 65,48 82,45" fill="#ffb6c1" />
        <path d="M 32 50 Q 37 44 42 50" stroke="#4a2c3a" stroke-width="2.5" fill="none" />
        <path d="M 58 50 Q 63 44 68 50" stroke="#4a2c3a" stroke-width="2.5" fill="none" />
        <polygon points="50,57 46,61 54,61" fill="#ff4d88" />
        <path d="M 44 63 Q 50 70 56 63" stroke="#4a2c3a" stroke-width="2" fill="none" />
        <circle cx="28" cy="58" r="5" fill="#ff80ab" opacity="0.6"/>
        <circle cx="72" cy="58" r="5" fill="#ff80ab" opacity="0.6"/>
      </svg>`
    };

    const DEFAULT_CONFIG = {
      names: { recipient: "Akshara", sender: "Someone who loves you" },
      welcome: {
        heading: "Hey Akshara! ❤️",
        subtitle: "I prepared a little surprise straight from my heart...",
        buttonText: "Open Surprise 🌸",
        sticker: "loveCat"
      },
      initialQuestion: {
        heading: "Akshara, can I ask you something?",
        subtitle: "Do you love me? ❤️",
        yesBtn: "YES ❤️",
        noBtn: "NO 🙈",
        sticker: "pleadCat"
      },
      pleadings: [
        { text: "Please don't say no... 🥺 Please click YES na!", sticker: "pleadCat", anim: "anim-bounce" },
        { text: "Do you really not love me? My heart is breaking... 💔", sticker: "sadCat", anim: "anim-float" },
        { text: "Please don't leave me... Look how much I care! 😭❤️", sticker: "cryingCat", anim: "anim-pulse" },
        { text: "Ek baar aur soch lo na please? Look into my eyes... 🥺🌸", sticker: "pleadCat", anim: "anim-bounce" },
        { text: "One last time... Will you stay with me forever? ❤️", sticker: "loveCat", anim: "anim-pulse" }
      ],
      finalCelebration: {
        heading: "I KNEW IT!!! ❤️🎉",
        subtitle: "I love you so, so much, Akshara!",
        letter: "Dear Akshara,\n\nThank you for choosing me and making my world so beautiful. Every smile of yours means everything to me. I promise to cherish you, protect your happiness, and stay by your side forever.\n\nForever & always yours ❤️",
        sticker: "celebrateCat"
      },
      settings: {
        musicUrl: "https://commondatastorage.googleapis.com/codeskulptor-demos/DDR_assets/Kangaroo_MusiQue_-_The_Neverending_Story.mp3"
      }
    };

    let appConfig = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    let currentView = 'welcome';
    let dodgeCount = 0;
    let audioStarted = false;

    // Unicode Base64 Decoder (supports Hindi text and emojis)
    function decodeMagicData(base64Str) {
      try {
        const decoded = decodeURIComponent(Array.prototype.map.call(atob(base64Str), function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(decoded);
      } catch (e) {
        return null;
      }
    }

    // Load Configuration: Checks URL Magic Hash first, then LocalStorage
    function reloadConfig() {
      let loaded = false;

      // 1. Check if boyfriend sent custom URL with #love=... or ?love=...
      const urlHash = window.location.hash || '';
      const urlSearch = window.location.search || '';
      let rawEncoded = '';

      if (urlHash.includes('love=')) {
        rawEncoded = urlHash.split('love=')[1].split('&')[0];
      } else if (urlSearch.includes('love=')) {
        rawEncoded = urlSearch.split('love=')[1].split('&')[0];
      }

      if (rawEncoded) {
        const magicConfig = decodeMagicData(rawEncoded);
        if (magicConfig) {
          appConfig = {
            names: { ...DEFAULT_CONFIG.names, ...(magicConfig.names || {}) },
            welcome: { ...DEFAULT_CONFIG.welcome, ...(magicConfig.welcome || {}) },
            initialQuestion: { ...DEFAULT_CONFIG.initialQuestion, ...(magicConfig.initialQuestion || {}) },
            pleadings: (magicConfig.pleadings && magicConfig.pleadings.length === 5) ? magicConfig.pleadings : DEFAULT_CONFIG.pleadings,
            finalCelebration: { ...DEFAULT_CONFIG.finalCelebration, ...(magicConfig.finalCelebration || {}) },
            settings: { ...DEFAULT_CONFIG.settings, ...(magicConfig.settings || {}) }
          };
          // Persist so subsequent reloads keep custom data
          localStorage.setItem(CONFIG_KEY, JSON.stringify(appConfig));
          loaded = true;
        }
      }

      // 2. Fallback to LocalStorage
      if (!loaded) {
        try {
          const stored = localStorage.getItem(CONFIG_KEY);
          if (stored) {
            const parsed = JSON.parse(stored);
            appConfig = {
              names: { ...DEFAULT_CONFIG.names, ...(parsed.names || {}) },
              welcome: { ...DEFAULT_CONFIG.welcome, ...(parsed.welcome || {}) },
              initialQuestion: { ...DEFAULT_CONFIG.initialQuestion, ...(parsed.initialQuestion || {}) },
              pleadings: (parsed.pleadings && parsed.pleadings.length === 5) ? parsed.pleadings : DEFAULT_CONFIG.pleadings,
              finalCelebration: { ...DEFAULT_CONFIG.finalCelebration, ...(parsed.finalCelebration || {}) },
              settings: { ...DEFAULT_CONFIG.settings, ...(parsed.settings || {}) }
            };
          }
        } catch (e) {
          appConfig = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
        }
      }
    }

    window.addEventListener('storage', (e) => {
      if (e.key === CONFIG_KEY) {
        reloadConfig();
        render();
      }
    });

    const bgAudio = document.getElementById('bg-audio');

    function playSynthesizedRomanticChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') ctx.resume();
        const notes = [261.63, 329.63, 392.00, 523.25, 440.00, 392.00, 349.23, 329.63];
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.45);
          gain.gain.setValueAtTime(0.08, ctx.currentTime + i * 0.45);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.45 + 0.9);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.45);
          osc.stop(ctx.currentTime + i * 0.45 + 1.0);
        });
      } catch (e) {}
    }

    function startMusic() {
      if (audioStarted) return;
      bgAudio.src = appConfig.settings.musicUrl || DEFAULT_CONFIG.settings.musicUrl;
      bgAudio.play().then(() => {
        audioStarted = true;
      }).catch(() => {
        playSynthesizedRomanticChime();
        audioStarted = true;
      });
    }

    function logAction(actionName) {
      try {
        const raw = localStorage.getItem(LOGS_KEY);
        let list = raw ? JSON.parse(raw) : [];
        list.unshift({
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
          date: new Date().toLocaleDateString(),
          action: actionName
        });
        localStorage.setItem(LOGS_KEY, JSON.stringify(list.slice(0, 150)));
      } catch (err) {}
    }

    // Particle Canvas
    const hCanvas = document.getElementById('hearts-canvas');
    const hCtx = hCanvas.getContext('2d');
    let heartParticles = [];

    function resizeHearts() {
      hCanvas.width = window.innerWidth;
      hCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeHearts);
    resizeHearts();

    function initHearts() {
      heartParticles = [];
      const count = window.innerWidth < 600 ? 16 : 28;
      for (let i = 0; i < count; i++) {
        heartParticles.push({
          x: Math.random() * hCanvas.width,
          y: Math.random() * hCanvas.height,
          size: Math.random() * 12 + 8,
          speedY: Math.random() * 0.7 + 0.3,
          opacity: Math.random() * 0.35 + 0.15
        });
      }
    }

    function animateHearts() {
      hCtx.clearRect(0, 0, hCanvas.width, hCanvas.height);
      hCtx.fillStyle = '#ff80ab';
      for (let p of heartParticles) {
        p.y -= p.speedY;
        if (p.y < -20) {
          p.y = hCanvas.height + 20;
          p.x = Math.random() * hCanvas.width;
        }
        hCtx.globalAlpha = p.opacity;
        hCtx.beginPath();
        const topCurve = p.size * 0.3;
        hCtx.moveTo(p.x, p.y + topCurve);
        hCtx.bezierCurveTo(p.x, p.y, p.x - p.size / 2, p.y, p.x - p.size / 2, p.y + topCurve);
        hCtx.bezierCurveTo(p.x - p.size / 2, p.y + (p.size + topCurve) / 2, p.x, p.y + (p.size + topCurve) / 1.5, p.x, p.y + p.size);
        hCtx.bezierCurveTo(p.x, p.y + (p.size + topCurve) / 1.5, p.x + p.size / 2, p.y + (p.size + topCurve) / 2, p.x + p.size / 2, p.y + topCurve);
        hCtx.bezierCurveTo(p.x + p.size / 2, p.y, p.x, p.y, p.x, p.y + topCurve);
        hCtx.closePath();
        hCtx.fill();
      }
      requestAnimationFrame(animateHearts);
    }
    initHearts();
    animateHearts();

    // Confetti
    const cCanvas = document.getElementById('confetti-canvas');
    const cCtx = cCanvas.getContext('2d');
    let confettiPieces = [];

    function burstConfetti() {
      cCanvas.width = window.innerWidth;
      cCanvas.height = window.innerHeight;
      confettiPieces = [];
      const pieceCount = window.innerWidth < 600 ? 110 : 160;
      for (let i = 0; i < pieceCount; i++) {
        confettiPieces.push({
          x: cCanvas.width * 0.5,
          y: cCanvas.height * 0.45,
          vx: (Math.random() - 0.5) * 15,
          vy: -(Math.random() * 14 + 5),
          size: Math.random() * 8 + 5,
          color: ['#ff4d88', '#ff80ab', '#ffffff', '#ffd700', '#c77dff'][Math.floor(Math.random() * 5)],
          opacity: 1
        });
      }
      animConfetti();
    }

    function animConfetti() {
      cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height);
      confettiPieces = confettiPieces.filter(p => p.opacity > 0);
      for (let p of confettiPieces) {
        p.vy += 0.35;
        p.x += p.vx;
        p.y += p.vy;
        p.opacity -= 0.007;
        cCtx.fillStyle = p.color;
        cCtx.globalAlpha = Math.max(0, p.opacity);
        cCtx.fillRect(p.x, p.y, p.size, p.size);
      }
      if (confettiPieces.length > 0) requestAnimationFrame(animConfetti);
    }

    function makeStickerNode(keyOrSrc, animClass = 'anim-bounce') {
      const wrap = document.createElement('div');
      wrap.className = `sticker-container ${animClass}`;

      if (SVG_STICKERS[keyOrSrc]) {
        wrap.innerHTML = `<div class="sticker-svg-wrap">${SVG_STICKERS[keyOrSrc]}</div>`;
        return wrap;
      }

      const normalized = normalizeStickerUrl(keyOrSrc);

      if (normalized && (normalized.startsWith('http://') || normalized.startsWith('https://') || normalized.startsWith('data:') || normalized.startsWith('blob:'))) {
        const img = document.createElement('img');
        img.className = 'sticker-img';
        img.loading = 'eager';
        img.alt = 'Romantic sticker';
        img.src = normalized;
        img.onerror = () => {
          wrap.innerHTML = `<div class="sticker-svg-wrap">${SVG_STICKERS.pleadCat}</div>`;
        };
        wrap.appendChild(img);
        return wrap;
      }

      wrap.innerHTML = `<span class="sticker-emoji">${keyOrSrc || '😻❤️'}</span>`;
      return wrap;
    }

    function removeEvasiveBtn() {
      const btn = document.getElementById('evasive-no-btn');
      if (btn) btn.remove();
    }

    const cardBox = document.getElementById('card-box');

    function render() {
      removeEvasiveBtn();
      cardBox.innerHTML = '';

      if (currentView === 'welcome') {
        renderWelcomeScreen();
      } else if (currentView === 'initial_question') {
        renderInitialQuestion();
      } else if (currentView.startsWith('pleading_')) {
        const stageIndex = parseInt(currentView.split('_')[1], 10);
        renderPleadingStage(stageIndex);
      } else if (currentView === 'celebration') {
        renderCelebration();
      }
    }

    function renderWelcomeScreen() {
      const sticker = makeStickerNode(appConfig.welcome.sticker, 'anim-bounce');
      cardBox.appendChild(sticker);

      const h1 = document.createElement('h1');
      h1.className = 'title-main';
      h1.textContent = appConfig.welcome.heading.replace(/Akshara/g, appConfig.names.recipient);
      cardBox.appendChild(h1);

      const p = document.createElement('p');
      p.className = 'subtitle-note';
      p.textContent = appConfig.welcome.subtitle;
      cardBox.appendChild(p);

      const row = document.createElement('div');
      row.className = 'btn-row';

      const openBtn = document.createElement('button');
      openBtn.className = 'btn-romantic btn-yes';
      openBtn.textContent = appConfig.welcome.buttonText;
      openBtn.addEventListener('click', () => {
        startMusic();
        logAction("Opened Surprise 🌸");
        currentView = 'initial_question';
        render();
      });

      row.appendChild(openBtn);
      cardBox.appendChild(row);
    }

    function renderInitialQuestion() {
      const sticker = makeStickerNode(appConfig.initialQuestion.sticker, 'anim-pulse');
      cardBox.appendChild(sticker);

      const h2 = document.createElement('h2');
      h2.className = 'title-main';
      h2.textContent = appConfig.initialQuestion.heading.replace(/Akshara/g, appConfig.names.recipient);
      cardBox.appendChild(h2);

      const p = document.createElement('p');
      p.className = 'subtitle-note';
      p.textContent = appConfig.initialQuestion.subtitle;
      cardBox.appendChild(p);

      const row = document.createElement('div');
      row.className = 'btn-row';

      const yesBtn = document.createElement('button');
      yesBtn.className = 'btn-romantic btn-yes';
      yesBtn.textContent = appConfig.initialQuestion.yesBtn || "YES ❤️";
      yesBtn.addEventListener('click', () => {
        startMusic();
        logAction("Pressed YES immediately on Initial Question! ❤️");
        currentView = 'celebration';
        render();
      });

      const noBtn = document.createElement('button');
      noBtn.className = 'btn-romantic btn-no';
      noBtn.textContent = appConfig.initialQuestion.noBtn || "NO 🙈";
      noBtn.addEventListener('click', () => {
        startMusic();
        logAction("Pressed NO on Initial Question -> Pleading Stage 1 triggered");
        currentView = 'pleading_0';
        render();
      });

      row.appendChild(yesBtn);
      row.appendChild(noBtn);
      cardBox.appendChild(row);
    }

    function renderPleadingStage(index) {
      const stage = appConfig.pleadings[index] || appConfig.pleadings[0];
      const isStage5 = (index === 4);

      const badge = document.createElement('span');
      badge.className = 'pleading-badge';
      badge.textContent = `Please listen... 🥺 (#${index + 1} of 5)`;
      cardBox.appendChild(badge);

      const sticker = makeStickerNode(stage.sticker, stage.anim || 'anim-bounce');
      cardBox.appendChild(sticker);

      const h2 = document.createElement('h2');
      h2.className = 'title-main';
      h2.textContent = stage.text.replace(/Akshara/g, appConfig.names.recipient);
      cardBox.appendChild(h2);

      const row = document.createElement('div');
      row.className = 'btn-row';

      const yesBtn = document.createElement('button');
      yesBtn.className = 'btn-romantic btn-yes';
      yesBtn.textContent = isStage5 ? "YES, I Love You! ❤️" : "YES ❤️";

      yesBtn.addEventListener('click', () => {
        startMusic();
        removeEvasiveBtn();
        logAction(`Pressed YES on Pleading Stage ${index + 1}! 🎉`);
        currentView = 'celebration';
        render();
      });
      row.appendChild(yesBtn);

      if (!isStage5) {
        const noBtn = document.createElement('button');
        noBtn.className = 'btn-romantic btn-no';
        noBtn.textContent = "NO 🙈";

        noBtn.addEventListener('click', () => {
          startMusic();
          logAction(`Pressed NO on Pleading Stage ${index + 1}`);
          currentView = `pleading_${index + 1}`;
          render();
        });
        row.appendChild(noBtn);
        cardBox.appendChild(row);
      } else {
        cardBox.appendChild(row);

        const evasiveNoBtn = document.createElement('button');
        evasiveNoBtn.className = 'btn-romantic btn-no btn-evasive-run';
        evasiveNoBtn.id = 'evasive-no-btn';
        evasiveNoBtn.textContent = "NO 🙈";

        const dodgeAway = (e) => {
          if (e && e.cancelable) e.preventDefault();
          if (e) e.stopPropagation();
          dodgeCount++;
          logAction(`Dodged NO on Stage 5 (Attempt #${dodgeCount})`);

          const pad = 16;
          const btnW = evasiveNoBtn.offsetWidth || 105;
          const btnH = evasiveNoBtn.offsetHeight || 48;

          const maxX = Math.max(pad, window.innerWidth - btnW - pad);
          const maxY = Math.max(pad, window.innerHeight - btnH - pad);

          const yesRect = yesBtn.getBoundingClientRect();
          let newX, newY, safe = false, attempts = 0;

          while (!safe && attempts < 20) {
            newX = Math.floor(Math.random() * (maxX - pad)) + pad;
            newY = Math.floor(Math.random() * (maxY - pad)) + pad;

            const overlap = !(newX + btnW < yesRect.left - 20 ||
                              newX > yesRect.right + 20 ||
                              newY + btnH < yesRect.top - 20 ||
                              newY > yesRect.bottom + 20);
            if (!overlap) safe = true;
            attempts++;
          }

          evasiveNoBtn.style.left = `${newX}px`;
          evasiveNoBtn.style.top = `${newY}px`;
        };

        evasiveNoBtn.addEventListener('pointerenter', dodgeAway);
        evasiveNoBtn.addEventListener('touchstart', dodgeAway, { passive: false });
        evasiveNoBtn.addEventListener('click', dodgeAway);

        document.body.appendChild(evasiveNoBtn);

        setTimeout(() => {
          const rect = yesBtn.getBoundingClientRect();
          const targetLeft = Math.min(window.innerWidth - 120, rect.right + 12);
          evasiveNoBtn.style.left = `${Math.max(16, targetLeft)}px`;
          evasiveNoBtn.style.top = `${rect.top}px`;
        }, 50);
      }
    }

    function renderCelebration() {
      removeEvasiveBtn();
      burstConfetti();

      const sticker = makeStickerNode(appConfig.finalCelebration.sticker, 'anim-bounce');
      cardBox.appendChild(sticker);

      const h1 = document.createElement('h1');
      h1.className = 'title-main';
      h1.textContent = appConfig.finalCelebration.heading;
      cardBox.appendChild(h1);

      const p = document.createElement('p');
      p.className = 'subtitle-note';
      p.textContent = appConfig.finalCelebration.subtitle.replace(/Akshara/g, appConfig.names.recipient);
      cardBox.appendChild(p);

      const letter = document.createElement('div');
      letter.className = 'letter-box';
      letter.textContent = appConfig.finalCelebration.letter
        .replace(/Akshara/g, appConfig.names.recipient)
        .replace(/Someone who loves you/g, appConfig.names.sender);
      cardBox.appendChild(letter);
    }

    reloadConfig();
    render();
  </script>
</body>
</html>
